        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              properties:
                action:
                  type: string
                  enum:
                  - status
                  - order
                  - cancel
                  - cancel_all
                  - set_leverage
                  - positions
                  - orders
                  - fills
                  - markets
                  - ticker
                  - orderbook
                  - funding
                  - withdraw
                  - transfer
                  - set_abstraction
                symbol:
                  type: string
                side:
                  type: string
                  enum:
                  - buy
                  - sell
                type:
                  type: string
                  enum:
                  - limit
                  - market
                amount:
                  type: string
                price:
                  type: string
                reduce_only:
                  type: boolean
                trigger_price:
                  type: string
                tp_sl:
                  type: string
                  enum:
                  - tp
                  - sl
                tif:
                  type: string
                  enum:
                  - GTC
                  - IOC
                  - PO
                order_id:
                  type: string
                leverage:

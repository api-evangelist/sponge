authentication:
  style: bearer
  header: 'Authorization: Bearer <SPONGE_API_KEY>'
  key_prefixes: [sponge_live_, sponge_test_]
  notes: >-
    One agent key is scoped to one agent. OAuth 2.0 (S256 PKCE) is also available

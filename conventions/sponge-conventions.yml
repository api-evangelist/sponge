pagination:
  style: limit
  params: [limit]
  notes: >-
    List endpoints (e.g. GET /api/transactions/history, GET /api/solana/tokens/search)
    accept a `limit` query parameter. No documented cursor/offset envelope.
idempotency:
  supported: false
  notes: >-
    No idempotency-key header or parameter is documented for write/payment
    operations as of this capture. Not asserting an Idempotency contract.
error_envelope:
  documented: false
  notes: >-
    The public OpenAPI documents only 200/204 success responses; no structured
    error catalog or application/problem+json schema is published. Errors are
    returned as HTTP status codes without a captured envelope schema.
rate_limiting:
  documented: false
payments:
  protocols: [x402, MPP]
  notes: >-
    Paid external-service calls use x402 (USDC) or MPP (Tempo, asset negotiated).
    Discovery is a 3-step flow: GET /api/discover -> GET /api/discover/:serviceId
    -> POST /api/paid/fetch (auto-selects x402 or MPP).

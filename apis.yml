aid: sponge
name: Sponge
description: >-
  Sponge builds financial infrastructure for the agent economy — wallets that let
  AI agents hold and spend money, and a gateway that lets businesses sell services
  directly to agents. The Sponge Wallet API gives an agent its own multi-chain
  crypto wallet with balances, transfers, swaps, cross-chain bridges, payment
  links, cards (including a Rain-issued Visa Sponge Card), fiat onramps (Coinbase,
  Stripe), and trading on Hyperliquid and Polymarket, plus paid access to external
  services via the x402 and MPP agent-payment protocols. A TypeScript and Python
  SDK, a spongewallet CLI, and hosted MCP servers ship first-party. Backed by
  Y Combinator (W2026).
